<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <!-- Link com o arquivo de estilos CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Container principal do boletim -->
  <div class="container">
    
    <!-- Cabeçalho da página -->
    <header class="cabecalho">
      <h1>Boletim Digital</h1>
      <h2>9º Ano - Ensino Fundamental</h2>
      <p class="estudante">Estudante: <span>Estudante Exemplo</span></p>
    </header>

    <!-- Área superior com os Cards de Resumo -->
    <section class="cards-container">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media-geral" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-total-faltas" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="card-atencao" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="card-frequencia" class="valor-card">92%</p>
        <span class="subtexto-card">Frequência adequada</span>
      </div>
    </section>

    <!-- Área da Tabela de Notas e Faltas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <!-- O corpo da tabela será preenchido automaticamente pelo JavaScript -->
        <tbody id="corpo-tabela">
        </tbody>
      </table>
    </section>

  </div>

  <!-- Link com o script JavaScript -->
  <script src="script.js"></script>
</body>
</html>
