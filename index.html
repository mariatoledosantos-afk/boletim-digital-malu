<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 9º Ano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Boletim Digital</h1>
        <p class="subtitulo">9º Ano — Estudante Exemplo</p>
    </header>

    <main class="container">
        <!-- Cards de Resumo -->
        <section class="cards-resumo">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="card-media-geral" class="card-valor">—</p>
            </div>
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="card-total-faltas" class="card-valor">—</p>
            </div>
            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="card-bom-desempenho" class="card-valor">—</p>
            </div>
            <div class="card">
                <h3>Precisam de Atenção</h3>
                <p id="card-atencao" class="card-valor">—</p>
            </div>
            <div class="card">
                <h3>Frequência</h3>
                <p class="card-valor">92%</p>
                <span class="card-detalhe">Frequência adequada</span>
            </div>
        </section>

        <!-- Tabela de Disciplinas -->
        <section class="tabela-container">
            <h2>Desempenho por Disciplina</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Disciplina</th>
                            <th>1º Tri</th>
                            <th>2º Tri</th>
                            <th>3º Tri</th>
                            <th>Média</th>
                            <th>Faltas</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        <!-- O JavaScript vai preencher as linhas aqui automaticamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
